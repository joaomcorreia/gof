<section class="site-section site-section-steps gof-template-row gof-template-row--light {{ section_class }} {{ section_container_class }}" id="{{ section_id|default:'process' }}">
  <div class="gof-template-inner">
    <div class="site-section-copy site-section-head">
      <span class="site-section-kicker">{{ values.kicker }}</span>
      <h2>{{ values.title }}</h2>
      <p>{{ values.intro }}</p>
    </div>
    <div class="site-steps-grid">
      <article class="site-step-card">
        <span>01</span>
        <strong>{{ values.step_1_title }}</strong>
        <p>{{ values.step_1_text }}</p>
      </article>
      <article class="site-step-card">
        <span>02</span>
        <strong>{{ values.step_2_title }}</strong>
        <p>{{ values.step_2_text }}</p>
      </article>
      <article class="site-step-card">
        <span>03</span>
        <strong>{{ values.step_3_title }}</strong>
        <p>{{ values.step_3_text }}</p>
      </article>
    </div>
  </div>
</section>
