<section class="site-section site-section-contact" id="contact">
  <div class="site-section-copy">
    <h2>{{ values.title }}</h2>
    <p>{{ values.description }}</p>
  </div>
  <div class="site-section-contact-card">
    <strong>{{ values.primary_contact }}</strong>
    <span>{{ values.secondary_contact }}</span>
    <a class="btn btn-primary" href="#">{{ values.cta_text }}</a>
  </div>
</section>
