{% load i18n %}
{% get_current_language as CURRENT_LANGUAGE %}
<div
  class="site-assistant"
  data-site-assistant
  data-assistant-language="{{ CURRENT_LANGUAGE|default:'en' }}"
  data-assistant-site-key="getonlinefast-public"
  data-assistant-version="v3"
  data-assistant-endpoint="{% url 'core:assistant_help' %}"
  data-assistant-path="{{ request.path }}"
  data-url-websites="{% url 'core:websites' %}"
  data-url-online-shop="{% url 'core:online_shop' %}"
  data-url-ads="{% url 'core:ads' %}"
  data-url-pricing="{% url 'core:pricing' %}"
  data-url-faq="{% url 'core:faq' %}"
  data-url-contact="{% url 'core:contact' %}"
  data-url-support="{% url 'core:support' %}"
  data-url-meta-ads="{% url 'core:facebook_instagram_ads' %}"
  data-url-google-ads="{% url 'core:google_ads' %}"
  data-url-linkedin-ads="{% url 'core:linkedin_ads' %}"
>
  <button type="button" class="site-assistant-toggle" data-assistant-toggle>
    <span data-assistant-toggle-label>{% trans "Need help?" %}</span>
  </button>
  <section class="site-assistant-panel" data-assistant-panel hidden>
    <header class="site-assistant-panel__header">
      <div>
        <strong>{% trans "Assistant" %}</strong>
        <p data-assistant-intro>{% trans "Quick help for websites, shops, ads, and support." %}</p>
      </div>
      <div class="site-assistant-panel__header-actions">
        <button type="button" class="site-assistant-reset" data-assistant-reset>{% trans "Reset" %}</button>
        <button type="button" class="site-assistant-close" data-assistant-close aria-label="{% trans 'Close' %}">&times;</button>
      </div>
    </header>
    <div class="site-assistant-messages" data-assistant-messages></div>
    <form class="site-assistant-form" data-assistant-form>
      {% csrf_token %}
      <label class="sr-only" for="site-assistant-input">{% trans "Question" %}</label>
      <input id="site-assistant-input" type="text" data-assistant-input placeholder="{% trans 'e.g. I need a website' %}">
      <button type="submit" class="btn btn-primary">{% trans "Send" %}</button>
    </form>
  </section>
</div>
