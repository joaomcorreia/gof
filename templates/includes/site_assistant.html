{% load i18n %}
<div
  class="site-assistant"
  data-site-assistant
  data-assistant-language="{{ CURRENT_LANGUAGE|default:'en' }}"
  data-url-websites="{% url 'core:websites' %}"
  data-url-online-shop="{% url 'core:online_shop' %}"
  data-url-ads="{% url 'core:ads' %}"
  data-url-pricing="{% url 'core:pricing' %}"
  data-url-faq="{% url 'core:faq' %}"
  data-url-contact="{% url 'core:contact' %}"
  data-url-support="{% url 'core:support' %}"
  data-url-meta-ads="{% url 'core:facebook_instagram_ads' %}"
  data-url-google-ads="{% url 'core:google_ads' %}"
  data-url-linkedin-ads="{% url 'core:linkedin_ads' %}"
>
  <button type="button" class="site-assistant-toggle" data-assistant-toggle>
    <span data-assistant-toggle-label>{% if CURRENT_LANGUAGE == 'nl' %}Hulp nodig?{% else %}Need help?{% endif %}</span>
  </button>
  <section class="site-assistant-panel" data-assistant-panel hidden>
    <header class="site-assistant-panel__header">
      <div>
        <strong>{% if CURRENT_LANGUAGE == 'nl' %}GOF hulp{% else %}GOF help{% endif %}</strong>
        <p data-assistant-intro>{% if CURRENT_LANGUAGE == 'nl' %}Snelle hulp bij websites, shops, advertenties en support.{% else %}Quick help for websites, shops, ads, and support.{% endif %}</p>
      </div>
      <button type="button" class="site-assistant-close" data-assistant-close aria-label="{% if CURRENT_LANGUAGE == 'nl' %}Sluiten{% else %}Close{% endif %}">&times;</button>
    </header>
    <div class="site-assistant-messages" data-assistant-messages></div>
    <form class="site-assistant-form" data-assistant-form>
      <label class="sr-only" for="site-assistant-input">{% if CURRENT_LANGUAGE == 'nl' %}Vraag{% else %}Question{% endif %}</label>
      <input id="site-assistant-input" type="text" data-assistant-input placeholder="{% if CURRENT_LANGUAGE == 'nl' %}Bijv. Ik heb een website nodig{% else %}e.g. I need a website{% endif %}">
      <button type="submit" class="btn btn-primary">{% if CURRENT_LANGUAGE == 'nl' %}Verstuur{% else %}Send{% endif %}</button>
    </form>
  </section>
</div>
